name: APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q not_by_seynes.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Android projesini hazırla
        working-directory: not_by_seynes
        run: |
          flutter create --org com.seynes --project-name not_by_seynes .
          rm -rf test
          python3 - <<'PY'
          import re
          import xml.dom.minidom
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          s = re.sub(r'android:label="[^"]*"', 'android:label="Not by Seynes"', s, count=1)
          izinler = ('<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n'
                     '    <uses-permission android:name="android.permission.INTERNET"/>\n    ')
          intent = '<intent><action android:name="android.speech.RecognitionService"/></intent>'
          if '<queries>' in s:
              s = s.replace('<queries>', '<queries>' + intent, 1)
          else:
              izinler += '<queries>' + intent + '</queries>\n    '
          s = s.replace('<application', izinler + '<application', 1)
          open(p, 'w', encoding='utf-8').write(s)
          xml.dom.minidom.parse(p)
          print(s)
          PY
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle* || true
      - name: APK derle
        working-directory: not_by_seynes
        run: |
          sed -i 's/speech_to_text: .*/speech_to_text: ^7.0.0/' pubspec.yaml
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: not-by-seynes-apk
          path: not_by_seynes/build/app/outputs/flutter-apk/app-release.apk
